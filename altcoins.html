<!doctype html>
<html lang="pt-br" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>Visual Cripto Hub | Multi-Asset Engine PrimeXBT</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        html, body { height: 100%; margin: 0; background: #050505; color: #00ff41; font-family: 'JetBrains Mono', monospace; overflow: hidden; }
        .scan-line {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,255,65,0.015) 2px, rgba(0,255,65,0.015) 4px);
            pointer-events: none; z-index: 50;
        }
        @keyframes ticker-scroll { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-scroll { animation: ticker-scroll 40s linear infinite; }
        .tf-btn.active { background: #00ff41 !important; color: #050505 !important; font-weight: bold; }
        .pos-btn.active-long { background: #00ff41 !important; color: #050505 !important; font-weight: bold; }
        .pos-btn.active-short { background: #ff3232 !important; color: #ffffff !important; font-weight: bold; }
        .pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #1a3a1a; }
    </style>
</head>
<body class="h-full">
    <div id="app-wrapper" class="h-full flex flex-col relative">
        <div class="scan-line"></div>

        <header class="relative z-10 flex items-center justify-between px-4 py-2 border-b border-[#00ff41]" style="background: #0a0a0a;">
            <div class="flex items-center gap-3">
                <div class="w-2 h-2 rounded-full pulse-glow" style="background: #00ff41; box-shadow: 0 0 8px #00ff41;"></div>
                <span class="text-sm font-bold tracking-widest uppercase" style="font-family: 'Orbitron';">MULTI-ASSET ENGINE</span>
                <span class="text-[9px] px-1.5 py-0.5 rounded bg-[#00ff4120] text-[#00ff41] border border-[#00ff4140]">MODO PRIMEXBT API</span>
            </div>
            <div class="flex items-center gap-4 text-xs">
                <a href="index.html" class="text-[10px] text-[#00ff41] hover:underline bg-[#050505] px-2 py-1 rounded border border-[#00ff4140]">⚡ IR PARA BTC TERMINAL</a>
                <span id="clock">00:00:00</span>
                <span id="status-badge" class="px-2 py-0.5 rounded border border-[#00ff4140]" style="background: rgba(0,255,65,0.1);">● LIVE SYNC</span>
            </div>
        </header>

        <main class="flex-1 relative z-10 flex overflow-hidden">
            <div class="flex-1 flex flex-col">
                <div class="flex items-center justify-between px-4 py-2 border-b border-[#111]">
                    <div class="flex items-center gap-3">
                        <label for="symbol-select" class="text-[10px] text-[#555] font-bold">ATIVO EM ANÁLISE:</label>
                        <select id="symbol-select" onchange="changeSymbol(this.value)" class="bg-[#050505] border border-[#00ff41] text-[#00ff41] text-sm font-bold px-2 py-1 rounded focus:outline-none cursor-pointer" style="font-family: 'Orbitron';">
                            <option value="BTCUSD">BTC / USD (Bitcoin PrimeXBT)</option>
                            <option value="ETHUSD">ETH / USD (Ethereum)</option>
                            <option value="TSLA">TSLA (Tesla Ações)</option>
                            <option value="XAGUSD">XAG / USD (Prata)</option>
                            <option value="XAUUSD">XAU / USD (Ouro)</option>
                        </select>
                    </div>
                    <div class="flex items-center gap-4">
                        <span id="price-display" class="text-xl font-bold" style="font-family: 'Orbitron';">—</span>
                        <span id="change-display" class="text-xs font-semibold px-2 py-0.5 rounded">—</span>
                    </div>
                </div>

                <div class="flex-1 relative bg-[#050505]">
                    <canvas id="chart-canvas"></canvas>
                </div>

                <div class="flex items-center gap-1 px-4 py-2 border-t border-[#111]">
                    <span class="text-[10px] text-[#333] mr-2">TIMEFRAME:</span>
                    <button class="tf-btn text-[10px] px-3 py-1 rounded active bg-[#111] text-[#555]">M30</button>
                    <button class="tf-btn text-[10px] px-3 py-1 rounded bg-[#111] text-[#555]">H1</button>
                    <button class="tf-btn text-[10px] px-3 py-1 rounded bg-[#111] text-[#555]">H4</button>
                    <button class="tf-btn text-[10px] px-3 py-1 rounded bg-[#111] text-[#555]">D1</button>
                </div>
            </div>

            <aside class="w-72 border-l border-[#111] flex flex-col bg-[#080808] overflow-y-auto">
                <div class="p-3">
                    <div class="text-[10px] font-bold mb-2 text-[#00ff41]">CALCULADORA DE SL / TP</div>
                    <div class="p-3 rounded bg-[#0a0a0a] border border-[#111] space-y-2.5">
                        <div class="flex gap-1">
                            <button id="btn-long" onclick="setPosType('LONG')" class="pos-btn active-long flex-1 text-[9px] py-1 rounded border border-[#00ff41]">LONG</button>
                            <button id="btn-short" onclick="setPosType('SHORT')" class="pos-btn flex-1 text-[9px] py-1 rounded border border-[#333] text-[#555]">SHORT</button>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label class="text-[8px] text-[#777]">ENTRADA ($)</label>
                                <button onclick="useCurrentPrice()" class="text-[8px] text-[#00ff41] hover:underline">[ATUAL]</button>
                            </div>
                            <input type="number" id="calc-entry" step="0.0001" class="w-full bg-[#050505] border border-[#222] text-[#00ff41] text-[10px] px-2 py-1 rounded focus:outline-none focus:border-[#00ff41]" oninput="calculateRiskReward()">
                        </div>

                        <div>
                            <label class="text-[8px] text-[#777] block mb-1">CAPITAL ($)</label>
                            <input type="number" id="calc-capital" value="1000" step="10" class="w-full bg-[#050505] border border-[#222] text-white text-[10px] px-2 py-1 rounded focus:outline-none focus:border-[#00ff41]" oninput="calculateRiskReward()">
                        </div>

                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="text-[8px] text-[#ff3232] block mb-1">STOP LOSS (%)</label>
                                <input type="number" id="calc-sl-pct" value="1.5" step="0.1" class="w-full bg-[#050505] border border-[#ff323240] text-[#ff3232] text-[10px] px-2 py-1 rounded focus:outline-none" oninput="calculateRiskReward()">
                            </div>
                            <div>
                                <label class="text-[8px] text-[#00ff41] block mb-1">TAKE PROFIT (%)</label>
                                <input type="number" id="calc-tp-pct" value="3.0" step="0.1" class="w-full bg-[#050505] border border-[#00ff4140] text-[#00ff41] text-[10px] px-2 py-1 rounded focus:outline-none" oninput="calculateRiskReward()">
                            </div>
                        </div>

                        <div class="pt-2 border-t border-[#111] space-y-1.5 text-[9px]">
                            <div class="flex justify-between"><span class="text-[#777]">PREÇO STOP:</span><span id="res-sl-price" class="text-[#ff3232] font-bold">—</span></div>
                            <div class="flex justify-between"><span class="text-[#777]">PERDA ESTIMADA:</span><span id="res-sl-val" class="text-[#ff3232]">—</span></div>
                            <div class="flex justify-between"><span class="text-[#777]">PREÇO TARGET:</span><span id="res-tp-price" class="text-[#00ff41] font-bold">—</span></div>
                            <div class="flex justify-between"><span class="text-[#777]">LUCRO ESTIMADO:</span><span id="res-tp-val" class="text-[#00ff41]">—</span></div>
                            <div class="flex justify-between pt-1 border-t border-[#111]"><span class="text-[#777]">RISCO : RETORNO:</span><span id="res-rr" class="text-white font-bold">—</span></div>
                        </div>
                    </div>
                </div>
            </aside>
        </main>

        <footer class="relative z-10 text-center py-1 border-t border-[#111] bg-[#080808]">
            <span class="text-[9px] text-[#1a3a1a]">© 2026 Visual Studio | Kovaliosky DeV</span>
        </footer>
    </div>

    <script>
        let currentSymbol = 'BTCUSD';
        let priceData = [];
        let posType = 'LONG';
        const canvas = document.getElementById('chart-canvas');
        const ctx = canvas.getContext('2d');

        function updateClock() {
            document.getElementById('clock').textContent = new Date().toLocaleTimeString('pt-BR');
        }
        setInterval(updateClock, 1000);
        updateClock();

        function changeSymbol(newSymbol) {
            currentSymbol = newSymbol;
            fetchCandles();
        }

        // LEITURA DO ARQUIVO GERADO PELO SCRIPT PYTHON DA PRIMEXBT
        async function fetchCandles() {
            try {
                const res = await fetch('primexbt_candles.json');
                const data = await res.json();
                
                if (data && data.candles) {
                    priceData = data.candles.map(c => ({
                        time: c.time || c[0],
                        open: parseFloat(c.open || c[1]),
                        high: parseFloat(c.high || c[2]),
                        low: parseFloat(c.low || c[3]),
                        close: parseFloat(c.close || c[4]),
                        volume: parseFloat(c.volume || c[5])
                    }));

                    const entryInput = document.getElementById('calc-entry');
                    if (entryInput && !entryInput.value && priceData.length > 0) {
                        entryInput.value = priceData[priceData.length - 1].close.toString();
                    }
                    
                    calculateRiskReward();
                    renderAll();
                }
            } catch (e) {
                console.error("Aguardando script Python gerar primexbt_candles.json...", e);
            }
        }

        function setPosType(type) {
            posType = type;
            document.getElementById('btn-long').className = type === 'LONG' ? "pos-btn active-long flex-1 text-[9px] py-1 rounded border border-[#00ff41]" : "pos-btn flex-1 text-[9px] py-1 rounded border border-[#333] text-[#555]";
            document.getElementById('btn-short').className = type === 'SHORT' ? "pos-btn active-short flex-1 text-[9px] py-1 rounded border border-[#ff3232]" : "pos-btn flex-1 text-[9px] py-1 rounded border border-[#333] text-[#555]";
            calculateRiskReward();
        }

        function useCurrentPrice() {
            if (priceData.length > 0) {
                document.getElementById('calc-entry').value = priceData[priceData.length - 1].close.toFixed(2);
                calculateRiskReward();
            }
        }

        function calculateRiskReward() {
            const entry = parseFloat(document.getElementById('calc-entry').value) || 0;
            const capital = parseFloat(document.getElementById('calc-capital').value) || 1000;
            const slPct = parseFloat(document.getElementById('calc-sl-pct').value) || 1.5;
            const tpPct = parseFloat(document.getElementById('calc-tp-pct').value) || 3.0;
            if (!entry) return;

            let slPrice, tpPrice;
            if (posType === 'LONG') {
                slPrice = entry * (1 - slPct / 100);
                tpPrice = entry * (1 + tpPct / 100);
            } else {
                slPrice = entry * (1 + slPct / 100);
                tpPrice = entry * (1 - tpPct / 100);
            }

            document.getElementById('res-sl-price').textContent = `$${slPrice.toFixed(2)}`;
            document.getElementById('res-sl-val').textContent = `-$${(capital * (slPct / 100)).toFixed(2)}`;
            document.getElementById('res-tp-price').textContent = `$${tpPrice.toFixed(2)}`;
            document.getElementById('res-tp-val').textContent = `+$${(capital * (tpPct / 100)).toFixed(2)}`;
            document.getElementById('res-rr').textContent = `1 : ${(tpPct / slPct).toFixed(2)}`;
        }

        function renderAll() {
            if (priceData.length === 0) return;
            const w = canvas.width = canvas.parentElement.clientWidth;
            const h = canvas.height = canvas.parentElement.clientHeight;
            ctx.clearRect(0, 0, w, h);

            const pad = { t: 30, b: 30, r: 60, l: 10 };
            const drawW = w - pad.l - pad.r, drawH = h - pad.t - pad.b;
            const maxP = Math.max(...priceData.map(d => d.high)), minP = Math.min(...priceData.map(d => d.low));
            const range = maxP - minP || 1;
            const getY = (p) => pad.t + drawH - ((p - minP) / range) * drawH;

            const candleW = (drawW / priceData.length) * 0.8;
            priceData.forEach((d, i) => {
                const x = pad.l + (i * (drawW / priceData.length)) + (drawW / priceData.length / 2);
                const color = d.close >= d.open ? '#00ff41' : '#ff3232';
                ctx.strokeStyle = color; ctx.fillStyle = color;
                
                ctx.beginPath(); ctx.moveTo(x, getY(d.high)); ctx.lineTo(x, getY(d.low)); ctx.stroke();
                
                const y1 = getY(d.open), y2 = getY(d.close);
                ctx.fillRect(x - candleW/2, Math.min(y1, y2), candleW, Math.max(1, Math.abs(y1 - y2)));
            });

            const last = priceData[priceData.length - 1];
            document.getElementById('price-display').textContent = `$${last.close.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 4})}`;
            const change = ((last.close - priceData[0].close) / priceData[0].close * 100).toFixed(2);
            document.getElementById('change-display').textContent = `${change}%`;
            document.getElementById('change-display').style.color = change >= 0 ? '#00ff41' : '#ff3232';
        }

        window.addEventListener('resize', renderAll);
        
        // Inicialização e loop de leitura do JSON local gerado pelo Python
        fetchCandles();
        setInterval(fetchCandles, 5000);
    </script>
</body>
</html>
